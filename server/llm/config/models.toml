# No es un modelo GGUF local: usa el CLI `agy` (Antigravity), autenticado
# por OAuth con la suscripción Google AI Pro/Ultra del usuario — requiere
# `agy` instalado y logueado (`agy` sin flags hace el login interactivo).
# Sin path/n_ctx/n_gpu_layers porque no hay archivo que cargar ni VRAM que
# reservar. Ver .claude/rules/ui-stack-architecture.md si se agrega un
# backend remoto nuevo con esta misma forma.
[models.agy]
backend = "agy"
license = "proprietary"
