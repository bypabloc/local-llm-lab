# Modelos disponibles para el router. Path relativo a la raíz del proyecto.
# Los .gguf no se versionan en git (ver .gitignore) — descargar manualmente
# en models/. Ver .claude/skills/add-model/SKILL.md para agregar uno nuevo.
#
# Contexto de por qué estos modelos: .claude/rules/research-context.md

[models.qwen3-4b]
path = "models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
n_ctx = 8192
n_threads = 12
n_gpu_layers = 0
license = "Apache-2.0"
hf_repo = "unsloth/Qwen3-4B-Instruct-2507-GGUF"
hf_file = "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"

