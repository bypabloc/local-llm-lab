[project]
name = "llm-lab-server"
version = "0.1.0"
description = "Servidor Django que expone el router de local-llm-lab vía HTTP para la UI Tauri"
requires-python = ">=3.14"
dependencies = [
    "django>=5.1",
    "django-cors-headers>=4.4",
    "daphne>=4.1",
    "local-llm-lab",
]

[dependency-groups]
dev = [
    "pytest-django>=4.9.0",
    "pytest-asyncio>=0.24.0",
    "django-stubs>=5.1.0",
    "pyinstaller>=6.11.0",
]

[tool.uv.sources]
local-llm-lab = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm", "server"]
