[project]
name = "local-llm-lab"
version = "0.1.0"
description = "Router extensible y CLI de benchmark para LLMs open source locales (GGUF)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "llama-cpp-python>=0.3.0",
    "typer>=0.15.0",
]

[project.scripts]
llm-lab = "core.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv.workspace]
members = ["server"]

[tool.ruff]
line-length = 88
target-version = "py313"  # ponytail: ruff/mypy aun no exponen py314 como target estable; subir cuando lo soporten

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"  # ponytail: mismo motivo que ruff target-version arriba
strict = true
warn_unused_ignores = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "server.settings"

[tool.pytest.ini_options]
testpaths = ["tests", "server"]
pythonpath = [".", "src", "server"]
DJANGO_SETTINGS_MODULE = "server.settings"
asyncio_mode = "auto"
