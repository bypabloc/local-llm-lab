[project]
name = "llm-lab-server"
version = "0.1.0"
description = "Servidor Django que expone un router de LLMs open source locales (GGUF) vía HTTP/SSE para la UI Tauri"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "llama-cpp-python>=0.3.0",
    "django>=5.1",
    "django-cors-headers>=4.4",
    "daphne>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.9.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "django-stubs>=5.1.0",
    "pyinstaller>=6.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/llm", "server/server"]

[tool.ruff]
line-length = 88
target-version = "py313"  # ponytail: ruff/mypy aun no exponen py314 como target estable; subir cuando lo soporten

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"  # ponytail: mismo motivo que ruff target-version arriba
strict = true
warn_unused_ignores = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "server.settings"

[tool.pytest.ini_options]
testpaths = ["server"]
pythonpath = ["server"]
DJANGO_SETTINGS_MODULE = "server.settings"
asyncio_mode = "auto"
